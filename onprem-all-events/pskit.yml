# On-premises deploy covering all event types + a 3-step workflow.
# Uses the same remote SSH + systemd + bundled Python setup that was previously working.
# provider.name MUST be "onprem" (the service name can be anything).

service: onprem-all-events

provider:
  name: onprem
  region: local
  runtime: python3.10
  architecture: x86_64
  options:
    host: 0.0.0.0
    port: 8080
    advertise: http://20.25.33.126:8080
    data_dir: /home/azureuser/.pskit/onprem-data
    # Optional: point services at built-in file brokers (default) or existing directories
    services:
      schedule: builtin
      queue: builtin
      topic: builtin
      storage: builtin          # or {use: directory, path: /some/existing/folder}
      workflow: embedded
    deploy:
      method: ssh                # scp is the same path
      host: 20.25.33.126
      user: azureuser
      port: 22
      pem: "C:\\Users\\asif.khan\\Documents\\github\\common_python_services\\kavion_library_testing\\onprem-example\\azure-small-machine\\onprem-demo.pem"
      known_hosts: accept-new
      path: /home/azureuser/.pskit/onprem-data  # remote install path (relative to home or absolute)
      python: bundle             # server does not need Python installed
      target_os: linux
      target_arch: x86_64
      install: systemd
      sudo: true

functions:
  # ---------- HTTP ----------
  hello:
    handler: app.handlers.hello
    events:
      - http: GET /hello
      - http: POST /hello

  # ---------- Schedule ----------
  tick:
    handler: app.handlers.tick
    events:
      - schedule:
          rate: 1 minutes
          input: {source: onprem-scheduler, job: heartbeat}
          timezone: UTC

  # ---------- Queue ----------
  worker:
    handler: app.handlers.worker
    events:
      - queue:
          name: jobs
          batch_size: 5
          dead_letter: jobs-dlq
          max_receive: 3

  audit-dlq:
    handler: app.handlers.audit_dlq
    events:
      - queue:
          name: jobs-dlq
          batch_size: 5

  # ---------- Storage (directory events) ----------
  on-upload:
    handler: app.handlers.on_upload
    events:
      - storage:
          bucket: uploads
          prefix: in/
          suffix: .csv
          events: [created, deleted]

  # ---------- Topic (pub/sub files) ----------
  on-order:
    handler: app.handlers.on_order
    events:
      - topic:
          name: orders
          filter:
            event_type: ["order.shipped", "order.created"]

  # ---------- Workflow task functions (3 steps) ----------
  validate-step:
    handler: app.handlers.validate_step

  process-step:
    handler: app.handlers.process_step

  notify-step:
    handler: app.handlers.notify_step

workflows:
  three-step-pipeline:
    description: Validate -> Process -> Notify (embedded on-prem engine)
    engine: embedded
    start_at: Validate
    states:
      Validate:
        type: task
        function: validate-step
        catch:
          - {errors: [ValueError], next: Failed}
        next: Process
      Process:
        type: task
        function: process-step
        next: Notify
      Notify:
        type: task
        function: notify-step
        end: true
      Failed:
        type: fail
        error: ValidationFailed
        cause: Input failed validation
