# On-premises example: GET/POST APIs + invoke + 3 workflows
# Run with: pskit deploy   (starts host on http://127.0.0.1:8080)

service: onprem-demo

provider:
  name: onprem
  region: local
  runtime: python3.12
  options:
    host: 127.0.0.1
    port: 8080
    data_dir: .pskit/onprem-data
    services:
      schedule: builtin
      queue: builtin
      topic: builtin
      storage: {use: directory, path: .onprem/buckets}
      workflow: embedded
    # Uncomment for remote SSH or Docker deploy (see DEPLOY.md)
    # deploy:
    #   method: local          # local | ssh | docker

functions:
  # ---- HTTP APIs ----
  list-items:
    handler: app.handlers.list_items
    events:
      - http: GET /items

  get-item:
    handler: app.handlers.get_item
    events:
      - http: GET /items/{id}

  create-item:
    handler: app.handlers.create_item
    events:
      - http: {method: POST, path: /items, cors: true}

  process-order:
    handler: app.handlers.process_order
    events:
      - http: {method: POST, path: /orders, cors: true}

  # ---- Invoke-only function ----
  price-calculator:
    handler: app.handlers.price_calculator
    # no events: called only via invoke() or POST /__pskit/invoke/price-calculator

  # ---- Workflow task functions ----
  validate-order:
    handler: app.handlers.validate_order

  reserve-stock:
    handler: app.handlers.reserve_stock

  charge-payment:
    handler: app.handlers.charge_payment

  send-confirmation:
    handler: app.handlers.send_confirmation

  create-shipment:
    handler: app.handlers.create_shipment

  notify-support:
    handler: app.handlers.notify_support

# ---- 3 Step Functions (workflows) ----
workflows:
  order-pipeline:
    description: Validate → reserve → charge → fulfil (parallel)
    engine: embedded
    start_at: Validate
    states:
      Validate:
        type: task
        function: validate-order
        catch:
          - {errors: [ValueError], next: Rejected}
        next: Reserve
      Reserve:
        type: task
        function: reserve-stock
        next: Charge
      Charge:
        type: task
        function: charge-payment
        retry:
          - {errors: [TimeoutError], max_attempts: 3, interval_seconds: 2, backoff_rate: 2}
        catch:
          - {errors: [ValueError], next: Declined}
        next: Fulfil
      Fulfil:
        type: parallel
        branches:
          - start_at: Confirm
            states:
              Confirm: {type: task, function: send-confirmation, end: true}
          - start_at: Ship
            states:
              Ship: {type: task, function: create-shipment, end: true}
        next: Done
      Done: {type: succeed}
      Rejected: {type: fail, error: OrderRejected}
      Declined: {type: fail, error: PaymentDeclined}

  simple-ping:
    description: Single task workflow
    engine: embedded
    start_at: Mark
    states:
      Mark: {type: task, function: validate-order, end: true}

  support-escalation:
    description: Choice + wait + task
    engine: embedded
    start_at: CheckPriority
    states:
      CheckPriority:
        type: choice
        choices:
          - {variable: $.priority, equals: high, next: Notify}
        default: Done
      Notify:
        type: task
        function: notify-support
        next: Wait
      Wait:
        type: wait
        seconds: 5
        next: Done
      Done: {type: succeed}
