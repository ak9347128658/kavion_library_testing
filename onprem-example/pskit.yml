# On-premises example: GET/POST APIs + invoke + 3 workflows
# Run with: pskit deploy
# SSH deploy to the Azure test VM. The host listens on 0.0.0.0:8080.
# Private key: onprem-example/azure-small-machine/onprem-demo.pem

service: onprem-demo

package:
  # The VM config and private key are not part of the function bundle.
  exclude:
    - azure-small-machine/**
    - "**/*.pem"

provider:
  name: onprem
  region: local
  runtime: python3.10
  architecture: x86_64
  options:
    host: 0.0.0.0
    port: 8080
    advertise: http://20.127.42.14:8080
    deploy:
      method: docker
      host: 20.127.42.14
      user: azureuser
      port: 22
      pem: C:\Users\asif.khan\Documents\github\common_python_services\kavion_library_testing\onprem-example\onprem-demo.pem
      image: pskit/onprem-demo:dev
      restart: unless-stopped
      install_docker: true
      sudo: true

functions:
  list-items:
    handler: app.handlers.list_items
    events:
      - http: GET /items

  get-item:
    handler: app.handlers.get_item
    events:
      - http: GET /items/{id}

  create-item:
    handler: app.handlers.create_item
    events:
      - http: {method: POST, path: /items, cors: true}

  process-order:
    handler: app.handlers.process_order
    events:
      - http: {method: POST, path: /orders, cors: true}

  price-calculator:
    handler: app.handlers.price_calculator

  validate-order:
    handler: app.handlers.validate_order

  reserve-stock:
    handler: app.handlers.reserve_stock

  charge-payment:
    handler: app.handlers.charge_payment

  send-confirmation:
    handler: app.handlers.send_confirmation

  create-shipment:
    handler: app.handlers.create_shipment

  notify-support:
    handler: app.handlers.notify_support

workflows:
  order-pipeline:
    engine: embedded
    start_at: Validate
    states:
      Validate:
        type: task
        function: validate-order
        next: Reserve
      Reserve:
        type: task
        function: reserve-stock
        next: Charge
      Charge:
        type: task
        function: charge-payment
        next: Done
      Done: {type: succeed}

  simple-ping:
    engine: embedded
    start_at: Mark
    states:
      Mark: {type: task, function: validate-order, end: true}

  support-escalation:
    engine: embedded
    start_at: CheckPriority
    states:
      CheckPriority:
        type: choice
        choices:
          - {variable: $.priority, equals: high, next: Notify}
        default: Done
      Notify:
        type: task
        function: notify-support
        next: Done
      Done: {type: succeed}