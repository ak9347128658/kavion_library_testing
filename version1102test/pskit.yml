# Edited with pskit studio. https://github.com/ak9347128658/serverless_kit
service: my-service
provider:
  name: onprem
  region: local
  stage: dev
  runtime: python3.10
  memory: 256
  timeout: 15
  environment:
    LOG_LEVEL: INFO
  options:
    host: 127.0.0.1
    port: 8080
    cluster:
      name: prod
      replicas: 2
functions:
  hello:
    handler: app.handlers.hello
    description: Says hello
    events:
    - http: GET /hello
  get-item:
    handler: app.handlers.get_item
    events:
    - http: GET /items/{id}
  create-item:
    handler: app.handlers.create_item
    events:
    - http:
        method: POST
        path: /items
        cors: true
  smtp-test:
    handler: app.handlers.smtp_test
    events:
    - smtp:
        resource: inbound-mail
  sqs-test-fun:
    handler: app.handlers.sqs_test_fun
    events:
    - queue:
        batch_size: 10
        resource: sqs-fun-test-jobs
resources:
  inbound-mail:
    connection:
      domains: asifkhanofficial.in
      host: 74.249.253.178
      hostname: mail.asifkhanofficial.in
      port: 25
    external: true
    type: smtp
  sqs-fun-test-jobs:
    type: queue
