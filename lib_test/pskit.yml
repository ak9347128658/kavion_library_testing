# Edited with pskit studio. https://github.com/ak9347128658/serverless_kit
service: my-service
provider:
  name: onprem
  stage: dev
  runtime: python3.10
  memory: 256
  timeout: 15
  environment:
    LOG_LEVEL: INFO
  options:
    port: 8080
    deploy:
      host_python: python3.10
      method: ssh
      server: VM_01
      python: system
      target_os: linux
      target_arch: x86_64
      node: system
      path: /home/azureuser/
    env_file: .env.onprem
    data_dir: /home/azureuser/
    host: 0.0.0.0
functions:
  hello:
    handler: app.handlers.hello
    description: Says hello
    events:
    - http: GET /hello
  get-item:
    handler: app.handlers.get_item
    events:
    - http: GET /items/{id}
  create-item:
    handler: app.handlers.create_item
    events:
    - http:
        method: POST
        path: /items
        cors: true
resources: {}
providers:
  onprem:
    options:
      host: 0.0.0.0
      port: 8080
      deploy:
        host_python: python3.10
        method: local
      env_file: .env.onprem
    region: local
