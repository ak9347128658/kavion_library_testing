# Edited with pskit studio. https://github.com/ak9347128658/serverless_kit
service: my-service
provider:
  name: onprem
  stage: dev
  runtime: python3.10
  memory: 256
  timeout: 15
  environment:
    LOG_LEVEL: INFO
  options:
    port: 8080
    deploy:
      host_python: python3.10
      method: ssh
      server: VM_01
      python: system
      target_os: linux
      target_arch: x86_64
      node: system
      path: /home/azureuser/
    env_file: .env.onprem
    data_dir: /home/azureuser/
    host: 0.0.0.0
functions:
  hello:
    handler: app.handlers.hello
    description: Says hello
    events:
    - http: GET /hello
  get-item:
    handler: app.handlers.get_item
    events:
    - http: GET /items/{id}
  create-item:
    handler: app.handlers.create_item
    events:
    - http:
        method: POST
        path: /items
        cors: true
  sqs-test:
    handler: app.handlers.sqs_test
    events:
    - storage:
        events:
        - created
        resource: files
        prefix: in
        suffix: .txt
  queue-test-fun:
    handler: app.handlers.queue_test_fun
    events:
    - queue:
        batch_size: 10
        resource: jobs
  ses-fun-test:
    handler: app.handlers.ses_fun_test
    events:
    - smtp:
        resource: inbound-mail
resources:
  files:
    connection:
      console_url: http://168.62.41.87:9001
    external: true
    options:
      access_key_env: PSKIT_FILES_ACCESS_KEY
      bucket: files
      driver: minio
      endpoint: http://168.62.41.87:9000
      secret_key_env: PSKIT_FILES_SECRET_KEY
    type: storage
  jobs:
    connection:
      ui_url: http://20.127.19.12:9325
    external: true
    options:
      access_key: pskit
      create_queue: true
      driver: sqs
      endpoint: http://20.127.19.12:9324
      queue_url: http://20.127.19.12:9324/000000000000/jobs
      region: us-east-1
      secret_key: pskit
    type: queue
  inbound-mail:
    connection:
      domains: asifkhanofficial.in
      host: 20.127.19.12
      hostname: mail.asifkhanofficial.in
      port: 25
    external: true
    type: smtp
providers:
  onprem:
    options:
      host: 0.0.0.0
      port: 8080
      deploy:
        host_python: python3.10
        method: local
      env_file: .env.onprem
    region: local
  aws:
    region: us-east-1
  azure:
    region: centralindia
