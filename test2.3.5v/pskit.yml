# Edited with pskit studio. https://github.com/ak9347128658/serverless_kit
service: my-service
provider:
  name: onprem
  region: local
  stage: dev
  runtime: python3.12
  memory: 256
  timeout: 15
  environment:
    LOG_LEVEL: INFO
  options:
    host: 127.0.0.1
    port: 8080
    env_file: .env.onprem
    placement:
      default: workers01
      groups:
        workers01:
          cluster: swarm-cluster-01
          functions:
          - step01
          - fn-test-cluster01
          - step04
        workers02:
          cluster: swarm-cluster-02
          functions:
          - step02
          - fn-test-cluster02
        workers03:
          server: AZ_VM_04_2cpu
          functions:
          - step03
          - fn-test-worker03
          - fun-smtp-test
functions:
  step01:
    handler: functions.step01.handler.main
    events:
    - storage:
        events:
        - created
        - deleted
        resource: s3
        bucket: mytestbucket
        prefix: uploads/
        suffix: .txt
  step02:
    handler: functions.step02.handler.main
  step03:
    handler: functions.step03.handler.main
  fn-test-cluster01:
    handler: functions.fn_test_cluster01.handler.main
    events:
    - http:
        method: GET
        path: /fn-test-cluster01
  step04:
    handler: functions.step04.handler.main
  fn-test-cluster02:
    handler: functions.fn_test_cluster02.handler.main
    events:
    - http:
        method: GET
        path: /fn-test-cluster02
  fn-test-worker03:
    handler: functions.fn_test_worker03.handler.main
    events:
    - http:
        method: GET
        path: /fn-test-worker03
  fun-smtp-test:
    handler: functions.fun_smtp_test.handler.main
    events:
    - smtp:
        resource: inbound-mail
  fun-smtp-test-cluster01:
    handler: functions.fun_smtp_test_cluster01.handler.main
    events:
    - smtp:
        resource: inbound-mail
resources:
  s3:
    connection:
      console_url: http://74.249.165.200:9000/ui/
      url_env: PSKIT_S3_URL
    external: true
    name: s3-bucket
    options:
      access_key_env: PSKIT_S3_ACCESS_KEY
      bucket: s3-bucket
      create_bucket: true
      driver: s3
      endpoint: http://74.249.165.200:9000
      path_style: true
      region: us-east-1
      secret_key_env: PSKIT_S3_SECRET_KEY
    type: storage
  secret-manager:
    connection:
      access_key_env: PSKIT_SECRET_MANAGER_ACCESS_KEY
      console_url: http://74.249.165.200:4584/ui/
      driver: aws
      region: us-east-1
      secret_key_env: PSKIT_SECRET_MANAGER_SECRET_KEY
      url: http://74.249.165.200:4584
    external: true
    type: custom
  inbound-mail:
    connection:
      domains: asifkhanofficial.in
      host: 74.249.165.200
      hostname: mail.asifkhanofficial.in
      port: 25
    external: true
    type: smtp
workflows:
  my-workflow:
    start_at: Call
    states:
      Call:
        type: task
        function: step01
        next: Wait
      Wait:
        type: wait
        seconds: 5
        next: Call2
      Call2:
        type: task
        function: step02
        next: Wait2
      Wait2:
        type: wait
        seconds: 5
        next: Call3
      Call3:
        type: task
        function: step03
        next: Call4
      Call4:
        type: task
        function: step04
        end: true
