service: my-api

provider:
  name: azure
  region: eastus
  stage: dev
  runtime: python3.12
  memory: 256
  timeout: 15
  environment:
    LOG_LEVEL: INFO

providers:
  azure:
    region: centralindia          # Pune — best choice (Availability Zones)
    # other options:
    # region: southindia          # Chennai
    # region: westindia           # Mumbai
    # region: indiasouthcentral   # Hyderabad
    options:
      subscription_id: "${env:ARM_SUBSCRIPTION_ID}"

functions:
  list-items:
    handler: app.handlers.list_items
    events:
      - http: GET /items

  get-item:
    handler: app.handlers.get_item
    events:
      - http: GET /items/{id}

  create-item:
    handler: app.handlers.create_item
    events:
      - http: POST /items

  update-item:
    handler: app.handlers.update_item
    events:
      - http: PUT /items/{id}
# NEW: no events → not an API, only invocable
  
  get-arn:
    handler: app.handlers.get_arn

package:
  exclude:
    - ".venv/**"
    - "venv/**"
    - "**/*.pyc"
    - "tests/**"
    - ".git/**"
    - "**/__pycache__/**"