# Edited with pskit studio. https://github.com/kavion-ai/py-serverless-kit
service: my-service
provider:
  name: onprem
  region: local
  stage: dev
  runtime: python3.12
  memory: 256
  timeout: 15
  environment:
    LOG_LEVEL: INFO
  options:
    host: 127.0.0.1
    port: 8080
functions:
  step01:
    handler: functions.step01.handler.main
  step02:
    handler: functions.step03.handler.main
  step03:
    handler: functions.step04.handler.main
resources: {}
workflows:
  my-workflow:
    start_at: Call
    states:
      Call:
        type: task
        function: step01
        next: Wait
      Wait:
        type: wait
        seconds: 10
        next: Call2
      Call2:
        type: task
        function: step02
        next: Wait2
      Wait2:
        type: wait
        seconds: 5
        next: Call3
      Call3:
        type: task
        function: step03
        end: true
