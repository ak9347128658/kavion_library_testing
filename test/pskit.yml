# Edited with pskit studio. https://github.com/kavion-ai/py-serverless-kit
service: pskit-demo
provider:
  name: onprem
  region: local
  stage: dev
  runtime: python3.12
  memory: 256
  timeout: 15
  environment:
    LOG_LEVEL: INFO
  options:
    host: 127.0.0.1
    port: 8080
    env_file: .env.onprem
functions: {}
resources: {}
