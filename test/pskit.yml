# Edited with pskit studio. https://github.com/kavion-ai/py-serverless-kit
service: my-service
provider:
  name: onprem
  region: local
  stage: dev
  runtime: python3.12
  memory: 256
  timeout: 15
  environment:
    LOG_LEVEL: INFO
  options:
    host: 127.0.0.1
    port: 8080
    deploy:
      server: AZ_VM_01_4cpu
      host: 0.0.0.0
      advertise: http://20.7.138.107:8080
      options:
        port: 8080
functions:
  myhellofn:
    handler: functions.myhellofn.handler.main
  step01:
    handler: functions.step01.handler.main
  step02:
    handler: functions.step02.handler.main
  step03:
    handler: functions.step03.handler.main
workflows:
  workflow-1:
    start_at: Step01
    states:
      Step01:
        type: task
        function: step01
        next: Wait1
      Wait1:
        type: wait
        seconds: 2
        next: Step02
      Step02:
        type: task
        function: step02
        next: Wait2
      Wait2:
        type: wait
        seconds: 2
        next: Step03
      Step03:
        type: task
        function: step03
        end: true
