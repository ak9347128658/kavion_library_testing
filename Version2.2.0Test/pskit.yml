# Edited with pskit studio. https://github.com/ak9347128658/serverless_kit
service: my-service
provider:
  name: onprem
  region: local
  stage: dev
  runtime: python3.12
  memory: 256
  timeout: 15
  environment:
    LOG_LEVEL: INFO
  options:
    host: 127.0.0.1
    port: 8080
    env_file: .env.onprem
functions:
  hello:
    handler: app.handlers.hello
    description: Says hello
    events:
    - http: GET /hello
  get-item:
    handler: app.handlers.get_item
    events:
    - http: GET /items/{id}
  create-item:
    handler: app.handlers.create_item
    events:
    - http:
        method: POST
        path: /items
        cors: true
  my-function-schdular:
    handler: app.handlers.my_function_schdular
    events:
    - schedule:
        rate: 1 minute
  fu-smtp-event-test:
    handler: app.handlers.fu_smtp_event_test
    runtime: python3.10
    events:
    - smtp:
        resource: inbound-mail
  step-fu-01:
    handler: app.handlers.step_fu_01
    events:
    - http:
        method: GET
        path: /step-fu-01
  step-02:
    handler: app.handlers.step_02
  step-03:
    handler: app.handlers.step_03
  test-storage-s3:
    handler: app.handlers.test_storage_s3
    events:
    - storage:
        events:
        - created
        resource: s3-files
        prefix: in
        suffix: .txt
resources:
  inbound-mail:
    connection:
      domains: asifkhanofficial.in
      host: 172.171.10.16
      hostname: mail.asifkhanofficial.in
      port: 25
    external: true
    type: smtp
  aws-secrets-manager:
    connection:
      access_key_env: PSKIT_AWS_SECRETS_MANAGER_ACCESS_KEY
      console_url: http://172.172.72.97:4584/ui/
      driver: aws
      region: us-east-1
      secret_key_env: PSKIT_AWS_SECRETS_MANAGER_SECRET_KEY
      url: http://172.172.72.97:4584
    external: true
    type: custom
  s3-files:
    connection:
      console_url: http://172.172.72.97:9001
    external: true
    options:
      access_key_env: PSKIT_S3_FILES_ACCESS_KEY
      bucket: s3-files
      driver: minio
      endpoint: http://172.172.72.97:9000
      secret_key_env: PSKIT_S3_FILES_SECRET_KEY
    type: storage
workflows:
  my-workflow:
    start_at: Call
    states:
      Call:
        type: task
        function: step-fu-01
        next: Call2
      Call2:
        type: task
        function: step-02
        next: Call3
      Call3:
        type: task
        function: step-03
        end: true
